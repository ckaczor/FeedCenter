version: 1.1.0.{build}
pull_requests:
  do_not_increment_build_number: true
skip_tags: true
image: Visual Studio 2022
configuration: Release
platform: x86
assembly_info:
  patch: true
  file: 'Properties\AssemblyInfo.cs'
  assembly_version: "{version}"
  assembly_file_version: "{version}"
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
install:
- ps: |
    Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:temp\dotnet-install.ps1"
    & $env:temp\dotnet-install.ps1 -Architecture x64 -Version '10.0.100' -InstallDir "$env:ProgramFiles\dotnet"
before_build:
  - ps: dotnet --version
  - ps: nuget restore .\Installer\
  - ps: dotnet publish .\Application\ /p:PublishProfile=Properties\PublishProfiles\x64.pubxml
build:
  project: Installer\Installer.sln
  verbosity: minimal
artifacts:
  - path: Installer\Bootstrapper\bin\Release\FeedCenterSetup.exe
    name: Release
for:
  - branches:
      only:
        - main
    deploy:
      - provider: Environment
        name: GitHub

  - branches:
      only:
        - prerelease
    version: 1.2.0.{build}
    deploy:
      - provider: Environment
        name: GitHub-Prerelease
